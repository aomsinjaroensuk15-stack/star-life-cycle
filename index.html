<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>life of a star — realistic</title>
<style>:root{
  --kimi-font-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --kimi-color-text-primary:#1a1a1a;--kimi-color-text-secondary:#444;
  --kimi-color-text-tertiary:#777;--kimi-color-text-quaternary:#999;
  --kimi-color-surface:#ffffff;--kimi-color-surface-muted:#e8e8e8;
  --kimi-color-border:#d4d4d4;
  --kimi-color-danger:#e5484d;--kimi-color-warning:#f5a524;
  --kimi-color-accent:#3b82f6;
}
@media (prefers-color-scheme: dark){
  :root{--kimi-color-text-primary:#f2f2f2;--kimi-color-text-secondary:#ccc;
  --kimi-color-text-tertiary:#999;--kimi-color-text-quaternary:#666;
  --kimi-color-surface:#111;--kimi-color-surface-muted:#2a2a2a;
  --kimi-color-border:#3a3a3a;--kimi-color-accent:#6aa6ff;}
}
body{margin:16px;background:transparent}
</style>
</head>
<body>
<style>
.sa button,.sa input{font:inherit}
.sa .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
</style>
<div class="sa" style="font-family:var(--kimi-font-sans);color:var(--kimi-color-text-primary)">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px">
    <div>
      <div style="font-size:17px;font-weight:500">life of a massive star</div>
      <div style="font-size:12px;color:var(--kimi-color-text-tertiary)">1 second ≈ a million years · realistic render · protostar → black hole</div>
    </div>
    <div style="display:flex;gap:8px">
      <button id="sPlay" style="border:1px solid var(--kimi-color-text-primary);background:var(--kimi-color-text-primary);color:var(--kimi-color-surface);border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer">pause</button>
      <button id="sReset" style="border:1px solid var(--kimi-color-border);background:transparent;color:var(--kimi-color-text-primary);border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer">restart</button>
    </div>
  </div>
  <canvas id="sSky" style="width:100%;height:340px;display:block;border-radius:12px;background:#03050a"></canvas>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px">
    <div><div style="font-size:12px;color:var(--kimi-color-text-tertiary)">stage</div><div id="sStage" style="font-size:15px;font-weight:500">protostar</div></div>
    <div><div style="font-size:12px;color:var(--kimi-color-text-tertiary)">age</div><div id="sAge" class="num" style="font-size:15px;font-weight:500">0.0 s</div></div>
    <div><div style="font-size:12px;color:var(--kimi-color-text-tertiary)">surface temp</div><div id="sTemp" class="num" style="font-size:15px;font-weight:500">≈ 3,000 K</div></div>
    <div><div style="font-size:12px;color:var(--kimi-color-text-tertiary)">radius</div><div id="sRad" class="num" style="font-size:15px;font-weight:500">3.0 R☉</div></div>
  </div>
  <div id="sTrack" style="display:flex;gap:4px;margin-top:12px"></div>
  <div style="height:4px;border-radius:999px;background:var(--kimi-color-surface-muted);margin-top:8px;overflow:hidden">
    <div id="sFill" style="height:100%;width:0%;background:var(--kimi-color-text-primary);border-radius:999px"></div>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:12px">
    <div id="sHint" style="font-size:12px;color:var(--kimi-color-text-tertiary)">a cold gas cloud collapses under gravity…</div>
    <label style="font-size:12px;color:var(--kimi-color-text-secondary);display:flex;align-items:center;gap:8px;flex:none">time warp
      <input id="sSpeed" type="range" min="0.5" max="3" step="0.5" value="1" style="accent-color:var(--kimi-color-text-primary);width:90px">
      <span id="sSpeedV" class="num" style="width:28px;display:inline-block">×1</span>
    </label>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$('sSky'),ctx=cv.getContext('2d');
let W=0,H=0,stars=[],vig=null,grainPat=null;
function seed(){stars=[];for(let i=0;i<130;i++){const c=Math.random();stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.1+0.25,p:Math.random()*6.28,s:0.3+Math.random()*1.4,d:0.15+Math.random()*0.5,col:c<0.12?'180,200,255':(c<0.24?'255,220,180':'255,255,255'),glint:Math.random()<0.05});}}
function resize(){const d=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
 vig=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.72);
 vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,0.4)');
 grainPat=ctx.createPattern(NOISE,'repeat');}
addEventListener('resize',resize);
function mkPuff(r,g,b,a){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');const gr=x.createRadialGradient(64,64,2,64,64,63);
 gr.addColorStop(0,'rgba('+r+','+g+','+b+','+a+')');gr.addColorStop(0.45,'rgba('+r+','+g+','+b+','+(a*0.5)+')');gr.addColorStop(1,'rgba('+r+','+g+','+b+',0)');
 x.fillStyle=gr;x.fillRect(0,0,128,128);return c;}
const PUFF={hot:mkPuff(205,222,255,0.9),warm:mkPuff(255,238,208,0.85),orange:mkPuff(255,168,88,0.8),red:mkPuff(255,108,58,0.75),deep:mkPuff(172,48,30,0.7),brown:mkPuff(116,50,36,0.6),dark:mkPuff(0,0,0,0.92)};
function mkNoise(){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');const im=x.createImageData(64,64);for(let i=0;i<im.data.length;i+=4){const v=(110+Math.random()*145)|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}x.putImageData(im,0,0);return c;}
const NOISE=mkNoise();
const BB=[[2500,[255,138,72]],[3000,[255,166,100]],[3500,[255,190,128]],[4000,[255,210,155]],[5000,[255,232,195]],[5800,[255,244,222]],[8000,[255,251,240]],[12000,[225,235,255]],[25000,[185,205,255]],[60000,[160,185,255]]];
function bb(TK){if(TK<=BB[0][0])return BB[0][1];for(let i=1;i<BB.length;i++){if(TK<=BB[i][0]){const a=BB[i-1],b=BB[i],f=(TK-a[0])/(b[0]-a[0]);return a[1].map((v,j)=>Math.round(v+(b[1][j]-v)*f));}}return BB[BB.length-1][1];}
function rgba(a,A){return 'rgba('+a[0]+','+a[1]+','+a[2]+','+A+')';}
function mix3(a,b,k){return a.map((v,i)=>Math.round(v+(b[i]-v)*k));}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ss=k=>{k=clamp(k,0,1);return k*k*(3-2*k);};
const T={proto:4,main:12,giant:15,sg:18,sn:18,bh:23,end:34};
function drawPhotosphere(cx,cy,r,TK,o){o=o||{};const i=o.boost||1,c=bb(TK);
 const glow=ctx.createRadialGradient(cx,cy,r*0.85,cx,cy,r*2.1);
 glow.addColorStop(0,rgba(c,Math.min(0.30*i,0.6)));glow.addColorStop(1,rgba(c,0));
 ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,r*2.1,0,6.283);ctx.fill();
 const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
 if(o.rimBright){g.addColorStop(0,rgba(c,0.85));g.addColorStop(0.6,rgba(c,0.92));g.addColorStop(0.86,'rgba(255,255,255,0.98)');g.addColorStop(1,rgba(c,0.5));}
 else{const e=mix3(c,[8,6,4],0.7);g.addColorStop(0,rgba(c,1));g.addColorStop(0.5,rgba(c,0.95));g.addColorStop(0.82,rgba(c,0.55));g.addColorStop(1,rgba(e,0.97));}
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,6.283);ctx.fill();
 if(o.hotCore){ctx.save();ctx.globalCompositeOperation='lighter';const hc=ctx.createRadialGradient(cx,cy,0,cx,cy,r*0.55);
  hc.addColorStop(0,'rgba(255,255,255,'+Math.min(0.8,0.5*i)+')');hc.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=hc;ctx.beginPath();ctx.arc(cx,cy,r*0.55,0,6.283);ctx.fill();ctx.restore();}}
function granulate(cx,cy,r,alpha,scale,rot){ctx.save();ctx.beginPath();ctx.arc(cx,cy,r*0.995,0,6.283);ctx.clip();
 ctx.globalCompositeOperation='overlay';ctx.globalAlpha=alpha;ctx.translate(cx,cy);ctx.rotate(rot);
 ctx.drawImage(NOISE,-scale/2,-scale/2,scale,scale);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.restore();}
function darkPatch(cx,cy,r,alpha,ox,oy){ctx.save();ctx.globalCompositeOperation='multiply';ctx.globalAlpha=alpha;
 const s=r*1.5;ctx.drawImage(PUFF.dark,cx+ox*r-s/2,cy+oy*r-s/2,s,s);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.restore();}
function spikes(cx,cy,len,alpha){ctx.save();ctx.globalCompositeOperation='lighter';
 for(const q of[[1,0],[0,1]]){const g=ctx.createLinearGradient(cx-q[0]*len,cy-q[1]*len,cx+q[0]*len,cy+q[1]*len);
  g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(0.5,'rgba(255,255,255,'+alpha+')');g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(cx-q[0]*len,cy-q[1]*len,q[0]?2*len:2.4,q[1]?2*len:2.4);}
 ctx.restore();}
let neb=[];
function spawnNeb(){neb=[];const spr=[PUFF.brown,PUFF.deep,PUFF.red];
 for(let i=0;i<9;i++)neb.push({a:Math.random()*6.283,d:0.9+Math.random()*1.7,s:1.7+Math.random()*2.4,rot:Math.random()*6.283,sp:spr[i%3],vr:(Math.random()-0.5)*0.05});}
function nebA(t){return t<3.5?1:t<5.5?1-(t-3.5)/2:0;}
function drawNeb(cx,cy,r0,a,dtE){ctx.save();
 for(const b of neb){b.rot+=b.vr*dtE;const x=cx+Math.cos(b.a)*b.d*r0,y=cy+Math.sin(b.a)*b.d*r0*0.82,s=b.s*r0;
  ctx.globalAlpha=a*(0.55+0.1*Math.sin(b.rot*3));ctx.save();ctx.translate(x,y);ctx.rotate(b.rot);
  ctx.drawImage(b.sp,-s/2,-s/2,s,s);ctx.restore();}
 ctx.globalAlpha=1;ctx.restore();}
function drawJets(cx,cy,r0,a,t){ctx.save();ctx.globalCompositeOperation='lighter';
 for(const s of[-1,1]){const L=r0*2.6,y0=cy+s*r0*0.15,y1=cy+s*(r0*0.15+L);
  const g=ctx.createLinearGradient(0,y0,0,y1);
  g.addColorStop(0,'rgba(190,215,255,'+(0.4*a)+')');g.addColorStop(1,'rgba(190,215,255,0)');
  ctx.fillStyle=g;ctx.fillRect(cx-2,Math.min(y0,y1),4,L);
  for(let k=1;k<=3;k++){const p=((t*0.5+k/3)%1),yy=cy+s*(r0*0.15+L*p);
   ctx.fillStyle='rgba(220,235,255,'+(a*0.5*(1-p)).toFixed(3)+')';ctx.beginPath();ctx.arc(cx,yy,2.2*(1-p*0.5),0,6.283);ctx.fill();}}
 ctx.globalCompositeOperation='source-over';ctx.restore();}
function drawProto(cx,cy,r0,t){
 const r=r0*0.16*(1+0.05*Math.sin(t*9));
 drawPhotosphere(cx,cy,r,12000,{hotCore:true});
 ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.4+0.1*Math.sin(t*17);
 const s=r*8;ctx.drawImage(PUFF.hot,cx-s/2,cy-s/2,s,s);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.restore();}
function drawMain(cx,cy,r0,t){
 const r=r0*(0.97+0.02*Math.sin(t*2)),flare=1+0.12*Math.pow(Math.max(0,Math.sin(t*7.3)),8);
 drawPhotosphere(cx,cy,r,5800,{});
 granulate(cx,cy,r,0.4,r*1.35,t*0.04+1);granulate(cx,cy,r,0.25,r*0.8,-t*0.025);
 spikes(cx,cy,r*5.5,(0.045*flare).toFixed(3));}
function drawCoolStar(cx,cy,r,TK,t,o){
 drawPhotosphere(cx,cy,r,TK,{boost:o.boost||1});
 granulate(cx,cy,r,o.granA,o.granScale,t*0.05);granulate(cx,cy,r,o.granA*0.6,o.granScale*0.55,-t*0.03);
 if(o.dip>0.02)darkPatch(cx,cy,r,o.dip*0.85,-0.28,-0.12);
 spikes(cx,cy,r*4.5,(0.035*(o.boost||1)).toFixed(3));}
let puffs=[];
function spawnSN(cx,cy,r0){puffs=[];
 for(let i=0;i<44;i++){const a=Math.random()*6.283,sp=(0.25+Math.pow(Math.random(),1.5)*1.5)*r0*1.9;
  puffs.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,rot:Math.random()*6.283,vr:(Math.random()-0.5)*0.6,grow:6+Math.random()*10,age:-Math.random()*0.9});}}
function drawFireball(cx,cy,r0,dt2){
 const fade=dt2<4.4?1:Math.max(0,1-(dt2-4.4)/1.0);if(fade<=0)return;
 const TK=Math.max(2600,2600+58000*Math.exp(-dt2/1.1));
 const r=dt2<0.35?r0*2.15:r0*(0.3+3.1*Math.min(1,(1-Math.exp(-(dt2-0.35)/0.8))*1.25));
 ctx.save();ctx.globalAlpha=fade;
 drawPhotosphere(cx,cy,r,TK,{rimBright:dt2<0.9,hotCore:dt2<1.4,boost:1+Math.exp(-dt2/0.5)*2});
 if(dt2<1.0){ctx.globalCompositeOperation='lighter';const ca=0.8*(1-dt2);
  const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,r*1.3);
  cg.addColorStop(0,'rgba(255,255,255,'+ca.toFixed(3)+')');cg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,cy,r*1.3,0,6.283);ctx.fill();ctx.globalCompositeOperation='source-over';}
 ctx.globalAlpha=1;ctx.restore();}
function drawSNAll(cx,cy,r0,t,dtE){const dt2=t-T.sn;if(dt2<0)return;
 drawFireball(cx,cy,r0,dt2);
 for(const p of puffs){if(p.age<0){p.age+=dtE;continue;}
  p.age+=dtE;const A=p.age,fadeA=Math.max(0,1-A/4.5);if(fadeA<=0)continue;
  p.x+=p.vx*dtE;p.y+=p.vy*dtE;p.vx*=0.99;p.vy*=0.99;p.rot+=p.vr*dtE;
  const sz=p.grow*(0.6+A*1.1);
  const sp=A<0.9?PUFF.hot:A<1.9?PUFF.warm:A<2.9?PUFF.orange:A<3.6?PUFF.red:PUFF.deep;
  ctx.save();ctx.globalCompositeOperation=A<1.6?'lighter':'source-over';ctx.globalAlpha=fadeA*(A<1.6?0.55:0.4);
  ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.drawImage(sp,-sz/2,-sz/2,sz,sz);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.restore();}
 if(dt2>0.6&&dt2<7){const er=r0*(0.8+dt2*1.9),ea=0.10*Math.max(0,1-dt2/7);
  ctx.strokeStyle='rgba(255,240,220,'+ea.toFixed(3)+')';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(cx,cy,er,0,6.283);ctx.stroke();}}
let diskP=[],bhInit=false;
function initBH(){diskP=[];for(let i=0;i<20;i++){const q=1.9+Math.random()*1.4;
 diskP.push({a:Math.random()*6.283,q:q,w:2.6/Math.pow(q,1.5),sz:0.7+Math.random()*1.2});}}
function drawBH(cx,cy,r0,t,dtE){
 const k=ss((t-T.bh)/2.5);if(k<=0)return;
 const R=r0*0.55*k,rx=R*3.4,ry=R*0.95;
 for(const p of diskP)p.a+=p.w*dtE;
 ctx.save();ctx.translate(cx,cy);ctx.rotate(-0.22);
 const dop=ctx.createLinearGradient(-rx,0,rx,0);
 dop.addColorStop(0,'rgba(235,242,255,0.95)');dop.addColorStop(0.3,'rgba(255,230,190,0.75)');dop.addColorStop(0.55,'rgba(255,160,90,0.5)');dop.addColorStop(0.8,'rgba(200,80,45,0.35)');dop.addColorStop(1,'rgba(140,45,30,0.15)');
 const dopB=ctx.createLinearGradient(-rx,0,0,0);
 dopB.addColorStop(0,'rgba(255,255,255,0.85)');dopB.addColorStop(1,'rgba(255,255,255,0)');
 const halo=ctx.createLinearGradient(-R*1.7,0,R*1.7,0);
 halo.addColorStop(0,'rgba(255,235,205,0.9)');halo.addColorStop(0.5,'rgba(255,170,95,0.55)');halo.addColorStop(1,'rgba(150,50,30,0.2)');
 const dot=(x,y,s,cc,a)=>{ctx.save();ctx.globalAlpha=a;ctx.fillStyle=cc;ctx.beginPath();ctx.arc(x,y,s,0,6.283);ctx.fill();ctx.restore();};
 ctx.lineCap='round';
 ctx.lineWidth=R*0.4;ctx.strokeStyle=dop;ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,Math.PI,Math.PI*2);ctx.stroke();
 for(const p of diskP){if(Math.sin(p.a)>=0)continue;const x=Math.cos(p.a)*p.q*R,y=Math.sin(p.a)*p.q*R*0.30;
  dot(x,y,p.sz,Math.cos(p.a)<0?'rgba(230,238,255,1)':'rgba(255,120,70,1)',0.4*k);}
 ctx.lineWidth=R*0.15;ctx.strokeStyle=halo;
 ctx.beginPath();ctx.arc(0,0,R*1.6,Math.PI,Math.PI*2);ctx.stroke();
 ctx.beginPath();ctx.arc(0,0,R*1.6,0,Math.PI);ctx.stroke();
 ctx.fillStyle='#000';ctx.beginPath();ctx.arc(0,0,R,0,6.283);ctx.fill();
 ctx.strokeStyle='rgba(255,248,230,'+(0.95*k).toFixed(3)+')';ctx.lineWidth=Math.max(1.1,R*0.045);
 ctx.beginPath();ctx.arc(0,0,R*1.09,0,6.283);ctx.stroke();
 ctx.lineWidth=R*0.4;ctx.strokeStyle=dop;ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI);ctx.stroke();
 ctx.globalCompositeOperation='lighter';ctx.strokeStyle=dopB;ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI);ctx.stroke();
 ctx.globalCompositeOperation='source-over';
 for(const p of diskP){if(Math.sin(p.a)<0)continue;const x=Math.cos(p.a)*p.q*R,y=Math.sin(p.a)*p.q*R*0.30;
  dot(x,y,p.sz,Math.cos(p.a)<0?'rgba(230,238,255,1)':'rgba(255,120,70,1)',0.85*k);}
 ctx.restore();}
function drawScene(dtE){
 ctx.fillStyle='#03050a';ctx.fillRect(0,0,W,H);
 ctx.save();ctx.globalAlpha=0.05;ctx.translate(W*0.5,H*0.15);ctx.rotate(-0.4);
 ctx.drawImage(PUFF.warm,-W*0.7,-H*0.16,W*1.4,H*0.32);ctx.globalAlpha=1;ctx.restore();
 for(const s of stars){const a=0.2+0.6*Math.abs(Math.sin(age*s.s+s.p));
  ctx.fillStyle='rgba('+s.col+','+(a*s.d*1.7).toFixed(3)+')';
  ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.283);ctx.fill();
  if(s.glint&&a>0.5){ctx.strokeStyle='rgba(255,255,255,'+(0.10*a).toFixed(3)+')';ctx.lineWidth=0.6;const L=s.r*5;
   ctx.beginPath();ctx.moveTo(s.x*W-L,s.y*H);ctx.lineTo(s.x*W+L,s.y*H);ctx.moveTo(s.x*W,s.y*H-L);ctx.lineTo(s.x*W,s.y*H+L);ctx.stroke();}}
 const cx=W/2,cy=H/2,r0=Math.min(W,H)*0.14,t=age;
 const na=nebA(t);
 if(na>0){drawNeb(cx,cy,r0,na,dtE);
  ctx.save();ctx.globalAlpha=na*0.5;const s=r0*2.6;ctx.drawImage(PUFF.dark,cx-s/2,cy-s/2,s,s);ctx.globalAlpha=1;ctx.restore();
  if(t<T.proto)drawJets(cx,cy,r0,na,t);}
 if(t<T.proto){drawProto(cx,cy,r0,t);}
 else if(t<T.main){drawMain(cx,cy,r0,t);}
 else if(t<T.giant){const k=ss((t-T.main)/3);const r=r0*(1+0.5*k);
  drawCoolStar(cx,cy,r,Math.round(5800-2000*k),t,{granA:0.45,granScale:r*1.7,dip:0,boost:1});}
 else if(t<T.sg){const k=ss((t-T.giant)/3);
  let r=r0*(1.5+0.65*k)*(1+0.05*Math.sin(t*5.5));
  const dip=0.5*Math.exp(-Math.pow(t-16.3,2)/0.35)+0.08+0.06*Math.sin(t*0.9);
  let boost=1;
  if(t>17.55){boost=1+Math.random()*0.5;r*=1+(Math.random()-0.5)*0.05;}
  drawCoolStar(cx,cy,r,Math.round(3500-500*k),t,{granA:0.6,granScale:r*2.3,dip:dip,boost:boost});
  if(t>17.55){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.random()*0.35;
   ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,r*0.6,0,6.283);ctx.fill();ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.restore();}}
 else{drawSNAll(cx,cy,r0,t,dtE);
  if(t>T.bh){if(!bhInit){initBH();bhInit=true;}drawBH(cx,cy,r0,t,dtE);}}
 const dt2=t-T.sn;
 if(dt2>=0&&dt2<1.2){ctx.fillStyle='rgba(255,255,255,'+(0.9*Math.exp(-dt2/0.3)).toFixed(3)+')';ctx.fillRect(0,0,W,H);}
 ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
 ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=0.05;
 const gx=Math.random()*64,gy=Math.random()*64;ctx.translate(-gx,-gy);
 ctx.fillStyle=grainPat;ctx.fillRect(0,0,W+64,H+64);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.restore();
 if(fade>0){ctx.fillStyle='rgba(3,5,10,'+clamp(fade/1.4,0,1).toFixed(3)+')';ctx.fillRect(0,0,W,H);}}
function info(t){
 if(t<T.proto)return['protostar','≈ '+(3000+Math.round(t*500)).toLocaleString('en-US')+' K',(3-t*0.5).toFixed(1)+' R☉','a cold gas cloud collapses — the core ignites',0];
 if(t<T.main)return['main sequence','≈ 5,800 K','1 R☉','hydrogen fusion burns steady for millions of years',1];
 if(t<T.giant){const k=(t-T.main)/3;return['red giant','≈ '+Math.round(5800-2000*k).toLocaleString('en-US')+' K','≈ '+Math.round(1+39*k)+' R☉','hydrogen runs out — the star swells and cools',2];}
 if(t<T.sg){const k=(t-T.giant)/3;return['red supergiant','≈ '+Math.round(3500-500*k).toLocaleString('en-US')+' K','≈ '+Math.round(40+960*k).toLocaleString('en-US')+' R☉','iron ash builds in the core — it is about to die',2];}
 if(t<23.5)return['supernova','≈ 10⁹ K core','expanding','core collapse — outshining a whole galaxy',3];
 return['black hole','—','event horizon','the core is gone. not even light escapes.',4];}
const CHIPS=[['protostar',4,'--kimi-color-accent'],['main sequence',8,'--kimi-color-warning'],['red supergiant',6,'--kimi-color-danger'],['supernova',5.5,'--kimi-color-text-primary'],['black hole',10.5,'--kimi-color-text-quaternary']];
const track=$('sTrack');
CHIPS.forEach(c=>{const d=document.createElement('div');
 d.style.cssText='flex:'+c[1]+' 1 0;min-width:0;border:1px solid var(--kimi-color-border);border-radius:6px;padding:4px 8px;font-size:11px;color:var(--kimi-color-text-tertiary);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;transition:all .15s ease-out';
 d.innerHTML='<span style="width:6px;height:6px;border-radius:50%;background:var('+c[2]+');flex:none"></span><span style="overflow:hidden;text-overflow:ellipsis">'+c[0]+'</span>';
 track.appendChild(d);});
function setChip(i){[...track.children].forEach((d,j)=>{const on=j===i;
 d.style.color=on?'var(--kimi-color-text-primary)':'var(--kimi-color-text-tertiary)';
 d.style.borderColor=on?'var('+CHIPS[j][2]+')':'var(--kimi-color-border)';
 d.style.background=on?'color-mix(in srgb, var('+CHIPS[j][2]+') 12%, transparent)':'transparent';
 d.style.fontWeight=on?'500':'400';});}
let age=0,playing=true,speed=1,last=performance.now(),fade=0;
function resetAll(){age=0;fade=0;puffs=[];bhInit=false;diskP=[];spawnNeb();}
$('sPlay').onclick=()=>{playing=!playing;$('sPlay').textContent=playing?'pause':'play';};
$('sReset').onclick=resetAll;
$('sSpeed').oninput=e=>{speed=parseFloat(e.target.value);$('sSpeedV').textContent='×'+speed;};
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();$('sPlay').click();}});
function frame(now){
 const dt=Math.min((now-last)/1000,0.05);last=now;
 const dtE=playing?dt*speed:0;
 const prev=age;age+=dtE;
 const cx=W/2,cy=H/2,r0=Math.min(W,H)*0.14;
 if(prev<T.sg&&age>=T.sg)spawnSN(cx,cy,r0);
 if(age>=T.end)fade+=dtE;
 if(fade>1.5)resetAll();
 drawScene(dtE);
 const inf=info(age);
 $('sStage').textContent=inf[0];$('sTemp').textContent=inf[1];$('sRad').textContent=inf[2];$('sHint').textContent=inf[3];
 $('sAge').textContent=age.toFixed(1)+' s';
 setChip(inf[4]);
 $('sFill').style.width=(clamp(age/T.end,0,1)*100).toFixed(1)+'%';
 requestAnimationFrame(frame);}
seed();spawnNeb();resize();requestAnimationFrame(frame);
</script>
</body>
